# Standalone klaxond — no Ansible required.
# Pull the image (or build from this dir) and bring up:
#   docker compose up -d
#
# Env vars: set in .env next to this file (see .env.example).
# On first run the container bootstraps /data/klaxond.toml from
# /app/klaxond.default.toml inside the image.

services:
  klaxond:
    image: ghcr.io/your-org/klaxond:latest  # or: git.luigibarretta.com/luigibarretta/klaxond:latest
    # Comment image: above and uncomment build: to build locally:
    # build: .
    container_name: klaxond
    restart: always
    ports:
      - "8181:8181"
    environment:
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN_INFO: ${NTFY_TOKEN_INFO:-}
      NTFY_TOKEN_WARN: ${NTFY_TOKEN_WARN:-}
      NTFY_TOKEN_CRIT: ${NTFY_TOKEN_CRIT:-}
      TOPIC_INFO: ${TOPIC_INFO:-}
      TOPIC_WARN: ${TOPIC_WARN:-}
      TOPIC_CRIT: ${TOPIC_CRIT:-}
      CASCADE_ENABLED: ${CASCADE_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      GRAFANA_BASE: ${GRAFANA_BASE:-}
      GRAFANA_RENDER_BASE: ${GRAFANA_RENDER_BASE:-}
      GRAFANA_RENDER_TOKEN: ${GRAFANA_RENDER_TOKEN:-}
      RENDER_IMAGE_TTL: ${RENDER_IMAGE_TTL:-900}
      KLAXOND_PUBLIC_URL: ${KLAXOND_PUBLIC_URL:-}
      ACK_DEFAULT_TTL_SECONDS: ${ACK_DEFAULT_TTL_SECONDS:-3600}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_BASIC_PASSWORD_HASH: ${AUTH_BASIC_PASSWORD_HASH:-}
      KLAXOND_INGEST_SECRET_GRAFANA: ${KLAXOND_INGEST_SECRET_GRAFANA:-}
      KLAXOND_INGEST_SECRET_BESZEL: ${KLAXOND_INGEST_SECRET_BESZEL:-}
      KLAXOND_INGEST_SECRET_HEALTHCHECKS: ${KLAXOND_INGEST_SECRET_HEALTHCHECKS:-}
      KLAXOND_INGEST_SECRET_WUD: ${KLAXOND_INGEST_SECRET_WUD:-}
      KLAXOND_INGEST_SECRET_AUTHENTIK: ${KLAXOND_INGEST_SECRET_AUTHENTIK:-}
      KLAXOND_INGEST_SECRET_SHELFMARK: ${KLAXOND_INGEST_SECRET_SHELFMARK:-}
      KLAXOND_INGEST_SECRET_PROWLARR: ${KLAXOND_INGEST_SECRET_PROWLARR:-}
      KLAXOND_INGEST_SECRET_DECYPHARR: ${KLAXOND_INGEST_SECRET_DECYPHARR:-}
      PORT: ${PORT:-8181}
      KLAXOND_CONFIG: ${KLAXOND_CONFIG:-/data/klaxond.toml}
      RENDER_CONFIG_PATH: ${RENDER_CONFIG_PATH:-/data/render-config.json}
      NTFY_TOPICS_PATH: ${NTFY_TOPICS_PATH:-/data/ntfy-topics.json}
      DEDUP_CONFIG_PATH: ${DEDUP_CONFIG_PATH:-/data/dedup-config.json}
      AUTH_CONFIG_PATH: ${AUTH_CONFIG_PATH:-/data/auth-config.json}
      AUTH_SESSION_KEY_PATH: ${AUTH_SESSION_KEY_PATH:-/data/auth-session.key}
      KLAXOND_BACKUP_DIR: ${KLAXOND_BACKUP_DIR:-/data/backups}
      DEDUP_PENDING_DIR: ${DEDUP_PENDING_DIR:-/data/dedup_pending}
      BESZEL_DB_PATH: ${BESZEL_DB_PATH:-/beszel_data/data.db}
    volumes:
      - klaxond-data:/data
      # Full UI/compose parity: instead of using the named volume above, you can
      # bind-mount the files exported by the UI "Full export" bundle:
      # - ./klaxond.toml:/data/klaxond.toml:rw
      # - ./render-config.json:/data/render-config.json:rw
      # - ./ntfy-topics.json:/data/ntfy-topics.json:rw
      # - ./dedup-config.json:/data/dedup-config.json:rw
      # - ./auth-config.json:/data/auth-config.json:rw

volumes:
  klaxond-data:

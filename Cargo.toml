[package]
name = "klaxond"
version = "0.14.34"
edition = "2024"

[dependencies]
anyhow = "1.0"
auth-modules = { path = "../auth-modules", default-features = false, features = ["audit", "errors", "ldap", "oidc-async", "oidc-pkce", "one-time-token", "password", "rate-limit", "recovery-codes", "security-profile", "session-policy", "totp"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
fs2 = "0.4"
hmac = "0.12"
hex = "0.4"
ipnet = "2.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
mime_guess = "2.0"
percent-encoding = "2.3"
postgres = "0.19.14"
rand = "0.9"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.48", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
urlencoding = "2.1"
webauthn-rs = { version = "0.6.1-dev", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
auth-modules = { path = "../auth-modules", default-features = false, features = ["testing"] }
tempfile = "3.23"

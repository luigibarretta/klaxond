name: Public release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: private-klaxond-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: klaxond_test
          POSTGRES_USER: klaxond
          POSTGRES_PASSWORD: klaxond-test
        options: >-
          --health-cmd "pg_isready -U klaxond -d klaxond_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact /repo

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Check security boundaries
        run: |
          bash scripts/check-rsa-private-usage.sh
          bash scripts/check-auth-gold-standard.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@858a1ecb106d4516018578006590eb829de1f08e # 1.96.1
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071

      - name: Check and test Rust
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features -- --nocapture

      - name: Test PostgreSQL persistence
        env:
          KLAXOND_TEST_POSTGRES_URL: postgres://klaxond:klaxond-test@127.0.0.1:5432/klaxond_test
        run: cargo test --locked --all-features -- --ignored --nocapture --test-threads=1

      - name: Test Rust application-event SDK
        run: cargo test --manifest-path sdk/rust/Cargo.toml --locked

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Test Go application-event SDK
        working-directory: sdk/go
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Check frontend and API contract
        run: |
          npm run static:check
          npm run loc:check
          npm run nasa:warn
          npm run openapi:lint
          npm run release:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browser workflows
        run: npm run test:e2e

  publish-platform:
    needs: check
    if: >-
      vars.KLAXOND_PUBLICATION_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: klaxond
            dockerfile: Dockerfile
            description: Notification routing service with durable emergency acknowledgement
            platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - image: klaxond
            dockerfile: Dockerfile
            description: Notification routing service with durable emergency acknowledgement
            platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
          - image: klaxond-frontend
            dockerfile: Dockerfile.frontend
            description: Static Klaxond UI and reverse proxy for split deployments
            platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - image: klaxond-frontend
            dockerfile: Dockerfile.frontend
            description: Static Klaxond UI and reverse proxy for split deployments
            platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute OCI metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push native platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true

      - name: Test the immutable backend from a clean install
        if: matrix.image == 'klaxond'
        env:
          KLAXOND_CLEAN_INSTALL_IMAGE: >-
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: bash scripts/test-clean-install.sh

      - name: Scan native image for fixed critical vulnerabilities
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_IMAGE: docker.io/aquasec/trivy@sha256:05d0126976bdedcd0782a0336f77832dbea1c81b9cc5e4b3a5ea5d2ec863aca7
        run: |
          set -euo pipefail
          docker_config_dir="${DOCKER_CONFIG:-${HOME}/.docker}"
          trivy_cache_dir="${RUNNER_TEMP}/trivy-cache"
          mkdir -p "${trivy_cache_dir}"

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${docker_config_dir}:/root/.docker:ro" \
            --volume "${trivy_cache_dir}:/var/cache/trivy" \
            "${TRIVY_IMAGE}" image \
              --cache-dir /var/cache/trivy \
              --scanners vuln \
              --platform "${{ matrix.platform }}" \
              --format table \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "${IMAGE}@${DIGEST}"

      - name: Attest native image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable native image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  assemble-main:
    needs: publish-platform
    if: >-
      vars.KLAXOND_PUBLICATION_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [klaxond, klaxond-frontend]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and verify the multi-architecture manifest
        id: assemble
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          amd64_source="${IMAGE}:sha-${GITHUB_SHA}-amd64"
          arm64_source="${IMAGE}:sha-${GITHUB_SHA}-arm64"
          amd64_digest="$(docker buildx imagetools inspect "${amd64_source}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          arm64_digest="$(docker buildx imagetools inspect "${arm64_source}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          [[ "${amd64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${arm64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          immutable="${IMAGE}:sha-${GITHUB_SHA}"
          docker buildx imagetools create \
            --tag "${immutable}" \
            --tag "${IMAGE}:edge" \
            "${IMAGE}@${amd64_digest}" \
            "${IMAGE}@${arm64_digest}"

          manifest_report="$(docker buildx imagetools inspect "${immutable}")"
          manifest_digest="$(sed -n 's/^Digest:[[:space:]]*//p' <<< "${manifest_report}" | head -n1)"
          edge_digest="$(docker buildx imagetools inspect "${IMAGE}:edge" | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          [[ "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${edge_digest}" = "${manifest_digest}"
          grep -Eq 'Platform:[[:space:]]+linux/amd64' <<< "${manifest_report}"
          grep -Eq 'Platform:[[:space:]]+linux/arm64' <<< "${manifest_report}"
          printf 'digest=%s\n' "${manifest_digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest multi-architecture manifest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.assemble.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable multi-architecture manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.assemble.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  promote-release:
    needs: check
    if: >-
      vars.KLAXOND_PUBLICATION_ENABLED == 'true' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [klaxond, klaxond-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify version and promote tested manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "$version" = "$crate_version"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          major_minor="${version%.*}"
          source="${IMAGE}:sha-${GITHUB_SHA}"
          source_digest="$(docker buildx imagetools inspect "$source" | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          test -n "$source_digest"
          for target in "${IMAGE}:${version}" "${IMAGE}:${major_minor}" "${IMAGE}:latest"; do
            docker buildx imagetools create --tag "$target" "${IMAGE}@${source_digest}"
            target_digest="$(docker buildx imagetools inspect "$target" | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
            test "$target_digest" = "$source_digest"
          done

  github-release:
    needs: promote-release
    if: >-
      vars.KLAXOND_PUBLICATION_ENABLED == 'true' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Package turnkey deployment files
        run: |
          mkdir -p dist
          cp docker-compose.yml .env.example dist/
          (cd dist && sha256sum docker-compose.yml .env.example > SHA256SUMS)
          tar -C dist -czf "dist/klaxond-${GITHUB_REF_NAME#v}-compose.tar.gz" docker-compose.yml .env.example SHA256SUMS
          mkdir -p dist/verify
          tar -xzf "dist/klaxond-${GITHUB_REF_NAME#v}-compose.tar.gz" -C dist/verify
          (cd dist/verify && sha256sum --check SHA256SUMS && docker compose config --quiet)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/klaxond-${GITHUB_REF_NAME#v}-compose.tar.gz"
          --verify-tag
          --generate-notes
          --title "Klaxond ${GITHUB_REF_NAME#v}"

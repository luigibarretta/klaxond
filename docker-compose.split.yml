# Split deployment example.
#
# Run one or more profiles depending on the host:
#   Backend host : docker compose -f docker-compose.split.yml --profile backend up -d
#   Frontend host: docker compose -f docker-compose.split.yml --profile frontend up -d
#   State host  : docker compose -f docker-compose.split.yml --profile db up -d
#   History DB  : docker compose -f docker-compose.split.yml --profile postgres up -d
#
# Klaxond does not require a SQL server. Its "db" tier is the file-backed state
# bundle under /data: klaxond.toml, render-config.json, ntfy-topics.json,
# dedup-config.json, auth-config.json, backups, dedup pending files, and the
# default SQLite history DB.
# For multi-host deploys, KLAXOND_DATA_VOLUME must be backed by shared storage
# that the backend host can mount too (for example NFS, Ceph, or a volume driver).
# PostgreSQL is optional for shared active/active delivery history.

services:
  klaxond-backend:
    image: ${KLAXOND_BACKEND_IMAGE:-ghcr.io/luigibarretta/klaxond:0.16.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${KLAXOND_BACKEND_CONTAINER:-klaxond-backend}
    restart: unless-stopped
    profiles: ["backend", "all"]
    ports:
      - "${KLAXOND_BACKEND_BIND:-127.0.0.1:8181}:8181"
    environment:
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN_INFO: ${NTFY_TOKEN_INFO:-}
      NTFY_TOKEN_WARN: ${NTFY_TOKEN_WARN:-}
      NTFY_TOKEN_CRIT: ${NTFY_TOKEN_CRIT:-}
      TOPIC_INFO: ${TOPIC_INFO:-}
      TOPIC_WARN: ${TOPIC_WARN:-}
      TOPIC_CRIT: ${TOPIC_CRIT:-}
      CASCADE_ENABLED: ${CASCADE_ENABLED:-false}
      KLAXOND_EMERGENCY_ENABLED: ${KLAXOND_EMERGENCY_ENABLED:-false}
      KLAXOND_EMERGENCY_ALLOW_INSECURE_PUBLIC_URL: ${KLAXOND_EMERGENCY_ALLOW_INSECURE_PUBLIC_URL:-false}
      KLAXOND_EMERGENCY_ALLOW_NTFY_ONLY: ${KLAXOND_EMERGENCY_ALLOW_NTFY_ONLY:-false}
      KLAXOND_EMERGENCY_SEVERITIES: ${KLAXOND_EMERGENCY_SEVERITIES:-critical}
      KLAXOND_EMERGENCY_RETRY_SECONDS: ${KLAXOND_EMERGENCY_RETRY_SECONDS:-60}
      KLAXOND_EMERGENCY_EXPIRE_SECONDS: ${KLAXOND_EMERGENCY_EXPIRE_SECONDS:-3600}
      KLAXOND_EMERGENCY_MAX_ATTEMPTS: ${KLAXOND_EMERGENCY_MAX_ATTEMPTS:-50}
      KLAXOND_EMERGENCY_LEASE_SECONDS: ${KLAXOND_EMERGENCY_LEASE_SECONDS:-60}
      KLAXOND_EMERGENCY_TELEGRAM_AFTER_ATTEMPTS: ${KLAXOND_EMERGENCY_TELEGRAM_AFTER_ATTEMPTS:-3}
      KLAXOND_EMERGENCY_SMTP_AFTER_ATTEMPTS: ${KLAXOND_EMERGENCY_SMTP_AFTER_ATTEMPTS:-5}
      KLAXOND_EMERGENCY_NOTIFY_ON_EXPIRY: ${KLAXOND_EMERGENCY_NOTIFY_ON_EXPIRY:-true}
      KLAXOND_EMERGENCY_AUTO_RESOLVE: ${KLAXOND_EMERGENCY_AUTO_RESOLVE:-true}
      KLAXOND_EMERGENCY_EXCLUDE_SOURCES: ${KLAXOND_EMERGENCY_EXCLUDE_SOURCES:-api-test}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      GRAFANA_BASE: ${GRAFANA_BASE:-}
      GRAFANA_RENDER_BASE: ${GRAFANA_RENDER_BASE:-}
      GRAFANA_RENDER_TOKEN: ${GRAFANA_RENDER_TOKEN:-}
      RENDER_IMAGE_TTL: ${RENDER_IMAGE_TTL:-900}
      KLAXOND_SOURCE_URL_UPTIME_KUMA: ${KLAXOND_SOURCE_URL_UPTIME_KUMA:-}
      KLAXOND_SOURCE_URL_HEALTHCHECKS: ${KLAXOND_SOURCE_URL_HEALTHCHECKS:-}
      KLAXOND_SOURCE_URL_WUD: ${KLAXOND_SOURCE_URL_WUD:-}
      KLAXOND_SOURCE_URL_PVE: ${KLAXOND_SOURCE_URL_PVE:-}
      KLAXOND_SOURCE_URL_SHELFMARK: ${KLAXOND_SOURCE_URL_SHELFMARK:-}
      KLAXOND_SOURCE_URL_PROWLARR: ${KLAXOND_SOURCE_URL_PROWLARR:-}
      KLAXOND_SOURCE_URL_DECYPHARR: ${KLAXOND_SOURCE_URL_DECYPHARR:-}
      KLAXOND_PUBLIC_URL: ${KLAXOND_PUBLIC_URL:-}
      ACK_DEFAULT_TTL_SECONDS: ${ACK_DEFAULT_TTL_SECONDS:-3600}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_BASIC_PASSWORD_HASH: ${AUTH_BASIC_PASSWORD_HASH:-}
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
      KLAXOND_INGEST_SECRET_GRAFANA: ${KLAXOND_INGEST_SECRET_GRAFANA:-}
      KLAXOND_INGEST_SECRET_BESZEL: ${KLAXOND_INGEST_SECRET_BESZEL:-}
      KLAXOND_INGEST_SECRET_HEALTHCHECKS: ${KLAXOND_INGEST_SECRET_HEALTHCHECKS:-}
      KLAXOND_INGEST_SECRET_UPTIME_KUMA: ${KLAXOND_INGEST_SECRET_UPTIME_KUMA:-}
      KLAXOND_INGEST_SECRET_WUD: ${KLAXOND_INGEST_SECRET_WUD:-}
      KLAXOND_INGEST_SECRET_AUTHENTIK: ${KLAXOND_INGEST_SECRET_AUTHENTIK:-}
      KLAXOND_INGEST_SECRET_SHELFMARK: ${KLAXOND_INGEST_SECRET_SHELFMARK:-}
      KLAXOND_INGEST_SECRET_PROWLARR: ${KLAXOND_INGEST_SECRET_PROWLARR:-}
      KLAXOND_INGEST_SECRET_DECYPHARR: ${KLAXOND_INGEST_SECRET_DECYPHARR:-}
      PORT: ${PORT:-8181}
      KLAXOND_CONFIG: ${KLAXOND_CONFIG:-/data/klaxond.toml}
      RENDER_CONFIG_PATH: ${RENDER_CONFIG_PATH:-/data/render-config.json}
      NTFY_TOPICS_PATH: ${NTFY_TOPICS_PATH:-/data/ntfy-topics.json}
      DEDUP_CONFIG_PATH: ${DEDUP_CONFIG_PATH:-/data/dedup-config.json}
      AUTH_CONFIG_PATH: ${AUTH_CONFIG_PATH:-/data/auth-config.json}
      AUTH_SESSION_KEY_PATH: ${AUTH_SESSION_KEY_PATH:-/data/auth-session.key}
      KLAXOND_BACKUP_DIR: ${KLAXOND_BACKUP_DIR:-/data/backups}
      DEDUP_PENDING_DIR: ${DEDUP_PENDING_DIR:-/data/dedup_pending}
      BESZEL_DB_PATH: ${BESZEL_DB_PATH:-/beszel_data/data.db}
      KLAXOND_SQLITE_PATH: ${KLAXOND_SQLITE_PATH:-/data/klaxond.db}
      KLAXOND_HISTORY_BACKEND: ${KLAXOND_HISTORY_BACKEND:-sqlite}
      KLAXOND_POSTGRES_URL: ${KLAXOND_POSTGRES_URL:-}
      KLAXOND_HISTORY_RETENTION: ${KLAXOND_HISTORY_RETENTION:-5000}
      KLAXOND_HISTORY_DEFAULT_LIMIT: ${KLAXOND_HISTORY_DEFAULT_LIMIT:-500}
    volumes:
      - klaxond-data:/data

  klaxond-frontend:
    image: ${KLAXOND_FRONTEND_IMAGE:-ghcr.io/luigibarretta/klaxond-frontend:0.16.0}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ${KLAXOND_FRONTEND_CONTAINER:-klaxond-frontend}
    restart: unless-stopped
    profiles: ["frontend", "all"]
    ports:
      - "${KLAXOND_FRONTEND_BIND:-127.0.0.1:8080}:8080"
    environment:
      KLAXOND_BACKEND_URL: ${KLAXOND_BACKEND_URL:-http://klaxond-backend:8181}
      KLAXOND_FRONTEND_MAX_BODY_SIZE: ${KLAXOND_FRONTEND_MAX_BODY_SIZE:-25m}

  klaxond-state:
    image: ${KLAXOND_STATE_IMAGE:-alpine:3.23}
    container_name: ${KLAXOND_STATE_CONTAINER:-klaxond-state}
    command: ["sh", "-c", "mkdir -p /data && tail -f /dev/null"]
    restart: unless-stopped
    profiles: ["db", "state", "all"]
    volumes:
      - klaxond-data:/data

  klaxond-postgres:
    image: ${KLAXOND_POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: ${KLAXOND_POSTGRES_CONTAINER:-klaxond-postgres}
    restart: unless-stopped
    profiles: ["postgres"]
    ports:
      - "${KLAXOND_POSTGRES_BIND:-127.0.0.1:55432}:5432"
    environment:
      POSTGRES_DB: ${KLAXOND_POSTGRES_DB:-klaxond}
      POSTGRES_USER: ${KLAXOND_POSTGRES_USER:-klaxond}
      POSTGRES_PASSWORD: ${KLAXOND_POSTGRES_PASSWORD:-}
    volumes:
      - klaxond-postgres-data:/var/lib/postgresql/data

volumes:
  klaxond-data:
    external: true
    name: ${KLAXOND_DATA_VOLUME:-klaxond-data}
  klaxond-postgres-data:
    external: true
    name: ${KLAXOND_POSTGRES_VOLUME:-klaxond-postgres-data}

  /swagger:
    get:
      tags: [Public]
      operationId: swaggerUiLegacy
      summary: Render the self-hosted Swagger UI from the legacy root alias.
      deprecated: true
      security: []
      responses:
        "200":
          description: Swagger UI HTML.
          content:
            text/html:
              schema:

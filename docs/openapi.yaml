components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: klaxond scoped token
      description: API keys and PATs created from `/api/auth/tokens`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: klaxond_session
      description: Signed browser session cookie.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Klaxond-CSRF
      description: Required on browser-originated mutations when using a session cookie.
    basicAuth:
      type: http
      scheme: basic
      description: Username/password auth for non-browser clients in basic or LDAP mode.
  parameters:
    Severity:
      name: severity
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Severity"
    DryRun:
      name: dry_run
      in: query
      required: false
      schema:
        type: integer
        enum: [0, 1]
      description: When set to `1`, parses and renders without sending downstream notifications.
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
      description: Case-insensitive keyword filter.
    Level:
      name: level
      in: query
      schema:
        type: string
        enum: [TRACE, DEBUG, INFO, WARN, ERROR]
      description: Minimum or exact log level depending on the UI filter.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    HistoryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 500
      description: Page size for delivery history. Supplying this parameter opts into the paginated response shape.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    OkJson:
      description: Standard success envelope.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
                example: true
    IngestAccepted:
      description: Webhook accepted, suppressed or dry-run rendered.
      content:
        application/json:
          schema:
            type: object
        text/plain:
          schema:
            type: string
    ClientError:
      description: Generic client-side error, including invalid input, missing credentials or authorization failure depending on the active auth mode.
      content:
        text/plain:
          schema:
            type: string
    BadRequest:
      description: Invalid request body, unsupported severity or validation failure.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Missing or invalid credentials.
      headers:
        X-Klaxond-Login:
          description: Login URL returned to browser fetch clients.
          schema:
            type: string
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Authenticated principal lacks the required scope.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Resource or auth method not available.
      content:
        text/plain:
          schema:
            type: string
    ReauthRequired:
      description: Sensitive browser mutation requires a fresh local reauthentication window.
      headers:
        X-Klaxond-Reauth:
          schema:
            type: string
            const: required
    TooManyRequests:
      description: Authentication rate limit exceeded.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Severity:
      type: string
      enum: [info, warning, critical]
    AlertPayload:
      type: object
      additionalProperties: true
      description: Upstream alert payload. klaxond accepts source-specific JSON shapes and normalizes them internally.
      examples:
        - status: firing
          commonLabels:
            alertname: HostDown
            severity: critical
            host: server-01
    User:
      type: object
      required: [sub, mode]
      properties:
        sub:
          type: string
        email:
          type: string
        name:
          type: string
        groups:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [none, basic, ldap, oidc, trusted-proxy, api_key, pat, passkey, magic_link]
        exp:
          type: integer
          format: int64
        csrf:
          type: string
          description: Browser CSRF token. Empty for Bearer-token clients.
        sudo_until:
          type: integer
          format: int64
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        totp:
          type: string
          description: Six-digit code when local TOTP is enabled.
        return_to:
          type: string
          default: /status
        fetch:
          type: string
          enum: ["0", "1"]
    LoginResponse:
      type: object
      required: [ok, return_to, csrf]
      properties:
        ok:
          type: boolean
        return_to:
          type: string
        csrf:
          type: string
    PasswordPolicy:
      type: object
      required: [min_length, max_length]
      properties:
        min_length:
          type: integer
          minimum: 1
          description: Minimum allowed local password length.
        max_length:
          type: integer
          minimum: 1
          description: Maximum accepted local password length.
    SudoRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
        totp:
          type: string
    SudoResponse:
      type: object
      required: [ok, sudo_until, csrf]
      properties:
        ok:
          type: boolean
        sudo_until:
          type: integer
          format: int64
        csrf:
          type: string
    TotpSetup:
      type: object
      required: [ok, secret, otpauth_uri]
      properties:
        ok:
          type: boolean
        secret:
          type: string
        otpauth_uri:
          type: string
          format: uri
    TotpEnableRequest:
      type: object
      required: [secret, code]
      properties:
        secret:
          type: string
        code:
          type: string
    AuthConfigUpdate:
      type: object
      additionalProperties: true
      description: Auth settings payload. Secret fields are accepted but redacted from read responses.
    CreateTokenRequest:
      type: object
      required: [name, kind, scopes]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [api_key, pat]
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type:
            - integer
            - "null"
          format: int64
    Token:
      type: object
      required: [id, name, kind, prefix, scopes, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [api_key, pat]
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: integer
          format: int64
        expires_at:
          type:
            - integer
            - "null"
          format: int64
        last_used_at:
          type:
            - integer
            - "null"
          format: int64
        enabled:
          type: boolean
    CreateTokenResponse:
      type: object
      required: [ok, token, record]
      properties:
        ok:
          type: boolean
        token:
          type: string
          description: Raw token returned once.
        record:
          $ref: "#/components/schemas/Token"
    StatusPayload:
      type: object
      additionalProperties: true
      properties:
        version:
          type: string
        cascade_enabled:
          type: boolean
        channels:
          type: object
        recent_deliveries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
    Delivery:
      type: object
      additionalProperties: true
      properties:
        ts:
          type: number
          format: double
          description: Unix timestamp in seconds.
        source:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        title:
          type: string
        channel:
          type: string
        suppressed_by:
          type: string
        ok:
          type: boolean
    LogEntry:
      type: object
      additionalProperties: true
      properties:
        ts:
          type: string
        level:
          type: string
        target:
          type: string
        message:
          type: string
    AuditEntry:
      type: object
      additionalProperties: true
      properties:
        ts:
          type: string
        actor:
          type: string
        action:
          type: string
        status:
          type: string
        detail:
          type: string
    PaginatedLogs:
      type: object
      required: [entries, total, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    PaginatedAudit:
      type: object
      required: [entries, total, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    PaginatedDeliveries:
      type: object
      required: [entries, total, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    SetupStatus:
      type: object
      additionalProperties: true
      properties:
        checks:
          type: array
          items:
            type: object
    ConfigBundle:
      type: object
      additionalProperties: true
      properties:
        format_version:
          type: integer
          example: 1
        exported_at:
          type: string
          format: date-time
        files:
          type: object
          additionalProperties:
            type: string

security:
  - bearerAuth: []
  - sessionCookie: []

  /api/dedup-config:
    get:
      tags: [Policy]
      operationId: getDedupConfig
      summary: Return notification noise-control settings and activity.
      description: |
        Returns per-source burst-grouping and repeat-suppression settings,
        ordered selective matching rules, live pending grouping counts, and
        recent persistent cooldown activity.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Dedup configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoiseControlConfig"
        "4XX":
          $ref: "#/components/responses/ClientError"
    post:
      tags: [Policy]
      operationId: updateDedupConfig
      summary: Replace notification noise-control settings.
      description: |
        Persists per-source burst grouping, repeat suppression and ordered
        selective matching rules to the dedup sidecar. Fields omitted by older
        clients are preserved; repeat suppression is disabled by default.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoiseControlUpdate"
      responses:
        "200":
          description: Noise-control settings saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoiseControlUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /inhibitions:
    get:

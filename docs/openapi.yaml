        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /prowlarr/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestProwlarr
      summary: Receive a Prowlarr event webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /decypharr/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestDecypharr
      summary: Receive a Decypharr event webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:

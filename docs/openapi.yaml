  /api/render-preview:
    post:
      tags: [Render]
      operationId: renderPreview
      summary: Preview rendered ntfy headers/body without sending a notification.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity:
                  $ref: "#/components/schemas/Severity"
                payload:
                  $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          description: Rendered notification preview.
          content:
            application/json:
              schema:

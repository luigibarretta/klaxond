      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Render configuration.
          content:
            application/json:
              schema:
                type: object
        "4XX":
          $ref: "#/components/responses/ClientError"
    post:
      tags: [Render]
      operationId: updateRenderConfig
      summary: Replace component dashboard mappings and TOML-backed render/runtime settings.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "428":

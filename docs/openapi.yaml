        "4XX":
          $ref: "#/components/responses/ClientError"
  /webhook/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestGrafanaAlertmanager
      summary: Receive a Grafana Alertmanager webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /beszel/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestBeszel
      summary: Receive a Beszel webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /healthchecks/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestHealthchecks
      summary: Receive a Healthchecks webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /wud/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestWud
      summary: Receive a WUD HTTP trigger.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:

        "4XX":
          $ref: "#/components/responses/ClientError"
  /healthz:
    get:
      tags: [Public]
      operationId: healthz
      summary: Health check used by container probes and load balancers.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
  /metrics:
    get:
      tags: [Public]
      operationId: prometheusMetrics
      summary: Prometheus metrics scrape endpoint.
      security: []

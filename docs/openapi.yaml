      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/Severity"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Test delivery result.
          content:
            application/json:
              schema:
                type: object
        "4XX":
          $ref: "#/components/responses/ClientError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: klaxond scoped token
      description: API keys and PATs created from `/api/auth/tokens`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: klaxond_session
      description: Opaque browser session cookie backed by the configured SQLite or PostgreSQL store.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Klaxond-CSRF
      description: Required on browser-originated mutations when using a session cookie.
    basicAuth:
      type: http
      scheme: basic
      description: Username/password auth for non-browser clients in basic or LDAP mode.
  parameters:
    Severity:
      name: severity
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Severity"
    DryRun:
      name: dry_run
      in: query
      required: false
      schema:
        type: integer
        enum: [0, 1]
      description: When set to `1`, parses and renders without sending downstream notifications.
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
      description: Case-insensitive keyword filter.
    Level:
      name: level
      in: query
      schema:
        type: string
        enum: [TRACE, DEBUG, INFO, WARN, ERROR]
      description: Minimum or exact log level depending on the UI filter.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    HistoryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 500
      description: Page size for delivery history. Supplying this parameter opts into the paginated response shape.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    OkJson:
      description: Standard success envelope.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
                example: true
    IngestAccepted:
      description: Webhook accepted, suppressed or dry-run rendered.
      content:
        application/json:
          schema:
            type: object
        text/plain:
          schema:
            type: string
    ClientError:
      description: Generic client-side error, including invalid input, missing credentials or authorization failure depending on the active auth mode.
      content:
        text/plain:
          schema:
            type: string
    BadRequest:
      description: Invalid request body, unsupported severity or validation failure.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Missing or invalid credentials.
      headers:
        X-Klaxond-Login:
          description: Login URL returned to browser fetch clients.
          schema:
            type: string
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Authenticated principal lacks the required scope.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Resource or auth method not available.
      content:
        text/plain:
          schema:
            type: string
    ReauthRequired:
      description: Sensitive browser mutation requires a fresh local reauthentication window.
      headers:
        X-Klaxond-Reauth:
          schema:
            type: string
            const: required
    TooManyRequests:
      description: Authentication rate limit exceeded.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Severity:
      type: string
      enum: [info, warning, critical]
    CascadeTier:
      type: object
      required: [name, timeout_seconds]
      properties:
        name:
          type: string
          enum: [ntfy, telegram, smtp]
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
    CascadeTimeoutPolicy:
      type: object
      required: [min_seconds, max_seconds, recommended_seconds, warning_below_seconds]
      properties:
        min_seconds:
          type: integer
          const: 1
        max_seconds:
          type: integer
          const: 60
        recommended_seconds:
          type: object
          required: [ntfy, telegram, smtp]
          properties:
            ntfy:
              type: integer
            telegram:
              type: integer
            smtp:
              type: integer
        warning_below_seconds:
          type: object
          required: [ntfy]
          properties:
            ntfy:
              type: integer
    CascadeConfig:
      type: object
      required:
        - tiers
        - default_enabled_for_webhook
        - runtime_enabled
        - timeout_policy
      properties:
        tiers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CascadeTier"
        default_enabled_for_webhook:
          type: boolean
        runtime_enabled:
          type: boolean
        timeout_policy:
          $ref: "#/components/schemas/CascadeTimeoutPolicy"
    CascadeConfigUpdate:
      type: object
      required: [tiers]
      properties:
        tiers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CascadeTier"
        default_enabled_for_webhook:
          type: boolean
    CascadeWarning:
      type: object
      required: [code, tier, timeout_seconds, recommended_seconds]
      properties:
        code:
          type: string
          enum: [ntfy_timeout_below_recommended]
        tier:
          type: string
          enum: [ntfy]
        timeout_seconds:
          type: integer
        recommended_seconds:
          type: integer
    CascadeConfigUpdateResponse:
      type: object
      required: [ok, tiers, warnings]
      properties:
        ok:
          type: boolean
          const: true
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/CascadeTier"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CascadeWarning"
    EmergencyConfig:
      type: object
      required:
        - enabled
        - allow_insecure_public_url
        - allow_ntfy_only
        - severities
        - retry_seconds
        - expire_seconds
        - max_attempts
        - lease_seconds
        - telegram_after_attempts
        - smtp_after_attempts
        - notify_on_expiry
        - auto_resolve
        - exclude_sources
      properties:
        enabled: { type: boolean }
        allow_insecure_public_url: { type: boolean }
        allow_ntfy_only: { type: boolean }
        severities:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
        retry_seconds: { type: integer, minimum: 30, maximum: 3600 }
        expire_seconds: { type: integer, minimum: 30, maximum: 10800 }
        max_attempts: { type: integer, minimum: 1, maximum: 50 }
        lease_seconds: { type: integer, minimum: 5, maximum: 300 }
        telegram_after_attempts: { type: integer, minimum: 1, maximum: 50 }
        smtp_after_attempts: { type: integer, minimum: 1, maximum: 50 }
        notify_on_expiry: { type: boolean }
        auto_resolve: { type: boolean }
        exclude_sources:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
    EmergencyConfigPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        allow_insecure_public_url: { type: boolean }
        allow_ntfy_only: { type: boolean }
        severities:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
        retry_seconds: { type: integer, minimum: 30, maximum: 3600 }
        expire_seconds: { type: integer, minimum: 30, maximum: 10800 }
        max_attempts: { type: integer, minimum: 1, maximum: 50 }
        lease_seconds: { type: integer, minimum: 5, maximum: 300 }
        telegram_after_attempts: { type: integer, minimum: 1, maximum: 50 }
        smtp_after_attempts: { type: integer, minimum: 1, maximum: 50 }
        notify_on_expiry: { type: boolean }
        auto_resolve: { type: boolean }
        exclude_sources:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
    EmergencyConfigEnvelope:
      type: object
      required: [settings, constraints, managed_fields, managed_by_environment, writeable]
      properties:
        settings:
          $ref: "#/components/schemas/EmergencyConfig"
        constraints:
          type: object
          additionalProperties: true
        managed_fields:
          type: object
          additionalProperties: { type: string }
        managed_by_environment: { type: boolean }
        writeable: { type: boolean }
    HistoryConfigPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        backend:
          type: string
          enum: [sqlite, postgres]
        postgres_url:
          type: string
          writeOnly: true
        retention:
          type: integer
          minimum: 100
          maximum: 1000000
        default_limit:
          type: integer
          minimum: 1
          maximum: 10000
    HistoryConfigEnvelope:
      type: object
      required: [settings, constraints, managed_fields, restart_required]
      properties:
        settings:
          type: object
          required: [backend, sqlite_path, postgres_url_configured, postgres_target, retention, default_limit]
          properties:
            backend: { type: string, enum: [sqlite, postgres] }
            sqlite_path: { type: string }
            postgres_url_configured: { type: boolean }
            postgres_target: { type: string }
            retention: { type: integer }
            default_limit: { type: integer }
        constraints:
          type: object
          additionalProperties: true
        managed_fields:
          type: object
          additionalProperties: { type: string }
        restart_required: { type: boolean, const: false }
    NoiseControlSetting:
      type: object
      required:
        - enabled
        - window_s
        - strategy
        - override_critical
        - repeat_suppression_enabled
        - repeat_window_s
        - repeat_override_critical
        - rules
      properties:
        enabled:
          type: boolean
          description: Whether inbound events are buffered for burst grouping.
        window_s:
          type: integer
          minimum: 1
          description: |
            Burst collection window in seconds. Admin API writes are clamped
            to 5..3600; legacy TOML and sidecar values remain readable.
        strategy:
          type: string
          description: |
            `key` groups source-specific identities; `time` groups the whole
            source window. Legacy configuration may contain other values,
            which behave as disabled grouping.
        override_critical:
          type: boolean
          description: When true, critical notifications also enter burst grouping.
        repeat_suppression_enabled:
          type: boolean
          description: Whether identical successfully delivered notifications enter a post-delivery cooldown.
        repeat_window_s:
          type: integer
          minimum: 60
          maximum: 604800
          description: Repeat-suppression cooldown in seconds.
        repeat_override_critical:
          type: boolean
          description: When true, repeated critical notifications can also be suppressed.
        rules:
          type: array
          maxItems: 50
          description: |
            Ordered selective overrides for this source. The first enabled
            matching rule wins; unmatched notifications use the source-wide
            repeat-suppression setting.
          items:
            $ref: "#/components/schemas/NoiseControlRule"
    NoiseControlRule:
      type: object
      required:
        - name
        - enabled
        - field
        - label
        - operator
        - pattern
        - case_sensitive
        - action
        - cooldown_s
        - include_critical
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        enabled:
          type: boolean
        field:
          type: string
          enum: [title_or_body, title, body, alertname, label]
        label:
          type: string
          maxLength: 128
          description: Required only when `field` is `label`; otherwise normalized to an empty string.
        operator:
          type: string
          enum: [exact, contains, regex]
        pattern:
          type: string
          minLength: 1
          maxLength: 512
          description: Exact value, substring or Rust-regex expression according to `operator`.
        case_sensitive:
          type: boolean
          description: Matching is case-insensitive by default, including regex matching.
        action:
          type: string
          enum: [suppress, bypass]
          description: Suppress identical repeats for the rule cooldown, or bypass repeat suppression and always deliver.
        cooldown_s:
          type: integer
          minimum: 60
          maximum: 604800
          description: Effective only for the `suppress` action.
        include_critical:
          type: boolean
          description: Explicit opt-in to suppress matching critical notifications.
    NoiseControlSettingPatch:
      type: object
      properties:
        enabled:
          type: boolean
        window_s:
          type: integer
          minimum: 5
          maximum: 3600
        strategy:
          type: string
          enum: [none, time, key]
        override_critical:
          type: boolean
        repeat_suppression_enabled:
          type: boolean
        repeat_window_s:
          type: integer
          minimum: 60
          maximum: 604800
        repeat_override_critical:
          type: boolean
        rules:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/NoiseControlRule"
    NoiseControlSettings:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/NoiseControlSetting"
    NoiseControlUpdate:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NoiseControlSettingPatch"
    NoiseControlUpdateResponse:
      type: object
      required: [ok, settings]
      properties:
        ok:
          type: boolean
          const: true
        settings:
          $ref: "#/components/schemas/NoiseControlSettings"
    RepeatSuppressionActivity:
      type: object
      required:
        - source
        - severity
        - title
        - last_suppressed_at
        - suppressed_count
        - cooldown_s
        - matched_rule
      properties:
        source:
          type: string
        severity:
          type: string
        title:
          type: string
        last_delivered_at:
          type: [number, "null"]
          format: double
          description: Unix timestamp of the last successful matching delivery.
        last_suppressed_at:
          type: number
          format: double
          description: Unix timestamp of the most recent suppression.
        suppressed_count:
          type: integer
          minimum: 1
        cooldown_s:
          type: integer
          minimum: 0
          description: Effective cooldown selected when the notification was evaluated.
        matched_rule:
          type: [string, "null"]
          description: Selective rule name, or null when the source default applied.
        next_allowed_at:
          type: [number, "null"]
          format: double
          description: Unix timestamp when the current cooldown expires under the active setting.
    NoiseControlConfig:
      type: object
      required:
        - sources
        - settings
        - pending_counts
        - recent_suppressed
        - limits
        - defaults
      properties:
        sources:
          type: array
          items:
            type: string
        settings:
          $ref: "#/components/schemas/NoiseControlSettings"
        pending_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        recent_suppressed:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RepeatSuppressionActivity"
        limits:
          type: object
          additionalProperties:
            type: object
            required: [min, max]
            properties:
              min:
                type: integer
              max:
                type: integer
        defaults:
          $ref: "#/components/schemas/NoiseControlSettings"
    AlertPayload:
      type: object
      additionalProperties: true
      description: Upstream alert payload. klaxond accepts source-specific JSON shapes and normalizes them internally.
      examples:
        - status: firing
          commonLabels:
            alertname: HostDown
            severity: critical
            host: server-01
    User:
      type: object
      required: [sub, mode]
      properties:
        sub:
          type: string
        email:
          type: string
        name:
          type: string
        groups:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [none, basic, ldap, oidc, trusted-proxy, api_key, pat, passkey, magic_link]
        exp:
          type: integer
          format: int64
        csrf:
          type: string
          description: Browser CSRF token. Empty for Bearer-token clients.
        sudo_until:
          type: integer
          format: int64
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        totp:
          type: string
          description: Six-digit code when local TOTP is enabled.
        return_to:
          type: string
          default: /status
        fetch:
          type: string
          enum: ["0", "1"]
    LoginResponse:
      type: object
      required: [ok, return_to, csrf]
      properties:
        ok:
          type: boolean
        return_to:
          type: string
        csrf:
          type: string
    PasswordPolicy:
      type: object
      required: [min_length, max_length]
      properties:
        min_length:
          type: integer
          minimum: 1
          description: Minimum allowed local password length.
        max_length:
          type: integer
          minimum: 1
          description: Maximum accepted local password length.
    SudoRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
        totp:
          type: string
    SudoResponse:
      type: object
      required: [ok, sudo_until, csrf]
      properties:
        ok:
          type: boolean
        sudo_until:
          type: integer
          format: int64
        csrf:
          type: string
    TotpSetup:
      type: object
      required: [ok, secret, otpauth_uri]
      properties:
        ok:
          type: boolean
        secret:
          type: string
        otpauth_uri:
          type: string
          format: uri
    TotpEnableRequest:
      type: object
      required: [secret, code]
      properties:
        secret:
          type: string
        code:
          type: string
    StepUpStatus:
      type: object
      required: [ok, factor, reason, return_to, user, passkey_registered, totp_registered]
      properties:
        ok:
          type: boolean
        factor:
          type: string
          enum: [passkey, hardware_key, totp]
        reason:
          type: string
        return_to:
          type: string
        user:
          type: object
          required: [sub, name, email]
          properties:
            sub:
              type: string
            name:
              type: string
            email:
              type: string
        passkey_registered:
          type: boolean
        totp_registered:
          type: boolean
    StepUpTokenRequest:
      type: object
      required: [step_up]
      properties:
        step_up:
          type: string
    StepUpPasskeyRegisterRequest:
      allOf:
        - $ref: "#/components/schemas/StepUpTokenRequest"
        - type: object
          properties:
            name:
              type: string
    StepUpTotpSetup:
      type: object
      required: [ok, request_id, secret, otpauth_uri]
      properties:
        ok:
          type: boolean
        request_id:
          type: string
        secret:
          type: string
        otpauth_uri:
          type: string
          format: uri
    StepUpTotpConfirmRequest:
      type: object
      required: [request_id, code]
      properties:
        request_id:
          type: string
        code:
          type: string
    StepUpTotpVerifyRequest:
      allOf:
        - $ref: "#/components/schemas/StepUpTokenRequest"
        - type: object
          required: [code]
          properties:
            code:
              type: string
    AuthConfigUpdate:
      type: object
      additionalProperties: true
      description: |
        Auth settings payload. Secret fields are accepted but redacted from read
        responses. `step_up.required_after_primary` enables MFA / step-up after
        primary authentication; `step_up.factor` selects `passkey`,
        `hardware_key` or `totp`.
    CreateTokenRequest:
      type: object
      required: [name, kind, scopes]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [api_key, pat]
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type:
            - integer
            - "null"
          format: int64
    Token:
      type: object
      required: [id, name, kind, prefix, scopes, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [api_key, pat]
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: integer
          format: int64
        expires_at:
          type:
            - integer
            - "null"
          format: int64
        last_used_at:
          type:
            - integer
            - "null"
          format: int64
        enabled:
          type: boolean
    CreateTokenResponse:
      type: object
      required: [ok, token, record]
      properties:
        ok:
          type: boolean
        token:
          type: string
          description: Raw token returned once.
        record:
          $ref: "#/components/schemas/Token"
    StatusPayload:
      type: object
      additionalProperties: true
      properties:
        version:
          type: string
        cascade_enabled:
          type: boolean
        channels:
          type: object
        recent_deliveries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
    Delivery:
      type: object
      additionalProperties: true
      properties:
        ts:
          type: number
          format: double
          description: Unix timestamp in seconds.
        source:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        title:
          type: string
        channel:
          type: string
        suppressed_by:
          type: string
        ok:
          type: boolean
    LogEntry:
      type: object
      additionalProperties: true
      properties:
        ts:
          type: string
        level:
          type: string
        target:
          type: string
        message:
          type: string
    AuditEntry:
      type: object
      additionalProperties: true
      properties:
        ts:
          type: string
        actor:
          type: string
        action:
          type: string
        status:
          type: string
        detail:
          type: string
    PaginatedLogs:
      type: object
      required: [entries, total, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    PaginatedAudit:
      type: object
      required: [entries, total, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    PaginatedDeliveries:
      type: object
      required: [entries, total, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    SetupStatus:
      type: object
      additionalProperties: true
      properties:
        checks:
          type: array
          items:
            type: object
    ConfigBundle:
      type: object
      additionalProperties: true
      properties:
        format_version:
          type: integer
          example: 1
        exported_at:
          type: string
          format: date-time
        files:
          type: object
          additionalProperties:
            type: string

security:
  - bearerAuth: []
  - sessionCookie: []

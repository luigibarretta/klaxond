        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /healthchecks/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestHealthchecks
      summary: Receive a Healthchecks webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /uptime-kuma/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestUptimeKuma
      summary: Receive an Uptime Kuma webhook and normalize its heartbeat state.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:

          $ref: "#/components/responses/BadRequest"
  /pve/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestPve
      summary: Receive a Proxmox VE event webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/login:
    get:
      tags: [Auth]
      operationId: loginPage
      summary: Render the public login page or redirect an existing session.
      security: []
      parameters:
        - name: return_to
          in: query
          schema:
            type: string
            default: /status
        - name: start
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Starts the OIDC redirect when OIDC mode is active.
      responses:
        "200":
          description: Login HTML.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to OIDC or an already authenticated return URL.
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/methods:
    get:
      tags: [Auth]
      operationId: listAuthMethods
      summary: Return available authentication methods.
      description: Returns stable auth method names and whether each method is enabled in the active Klaxond runtime configuration.
      security: []
      responses:
        "200":
          description: Authentication method availability.
          content:
            application/json:
              schema:
                type: object
                required: [methods]
                properties:
                  methods:
                    type: array
                    items:
                      type: object
                      required: [method, enabled]
                      properties:
                        method:
                          type: string
                          enum: [password, oidc, totp, passkey, hardware_key, trusted_proxy, ldap, api_token, magic_link]
                        enabled:
                          type: boolean
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/password-policy:
    get:
      tags: [Auth]
      operationId: getPasswordPolicy
      summary: Return the active local password policy.
      description: Returns the shared Argon2id password policy limits that the frontend uses for local password fields.
      security: []
      responses:
        "200":
          description: Password policy limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordPolicy"
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/local/login:
    post:
      tags: [Auth]
      operationId: localLogin
      summary: Create a local or LDAP username/password session.
      description: Uses Argon2id local credentials in `basic` mode and LDAP bind verification in `ldap` mode.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JSON login response for fetch requests.
          headers:
            Set-Cookie:
              description: Opaque, server-backed `klaxond_session` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "302":
          description: HTML form login redirects to the sanitized return URL.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/magic/request:
    post:
      tags: [Auth]
      operationId: requestMagicLink
      summary: Request a short-lived local magic login link.
      description: >
        Returns `sent: true` for known and unknown users; when Klaxond can
        surface the link directly for the configured local user, the JSON
        response includes `link`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                return_to:
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                return_to:
                  type: string
      responses:
        "200":
          description: Magic link request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [sent, expiresInSeconds]
                properties:
                  sent:
                    type: boolean
                  link:
                    type:
                      - string
                      - "null"
                  expiresInSeconds:
                    type: integer
        "302":
          description: Browser form requests redirect to the callback when a local user matches, or back to the login page otherwise.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/magic/callback/{token}:
    get:
      tags: [Auth]
      operationId: consumeMagicLink
      summary: Consume a one-time magic login token.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Session established and redirected to the sanitized return URL, or redirected to login with an error code.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/callback:
    get:
      tags: [Auth]
      operationId: oidcCallback
      summary: Complete the OIDC authorization-code callback.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Session established and redirected to the original return URL.
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: OIDC discovery or token exchange failed.
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Clear session cookies.
      security: []
      responses:
        "200":
          description: Session cookies cleared.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/backchannel-logout:
    post:
      tags: [Auth]
      operationId: oidcBackchannelLogout
      summary: Revoke OIDC browser sessions from a provider logout token.
      description: Validates a signed OpenID Connect Back-Channel Logout token with the prepared provider keys, rejects replayed token identifiers and revokes matching persistent sessions.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
                  description: Signed OIDC Back-Channel Logout JWT.
      responses:
        "200":
          description: Logout token accepted, including an idempotent replay.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: The prepared OIDC provider or persistent session store is unavailable.
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      summary: Return the current user, auth mode, scopes and browser CSRF token.
      security:
        - bearerAuth: []
        - basicAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/reauth:
    post:
      tags: [Auth]
      operationId: reauth
      summary: Refresh the short reauthentication window for local sessions.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SudoRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SudoRequest"
      responses:
        "200":
          description: Reauthentication accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SudoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/passkey/login:
    get:
      tags: [Auth]
      operationId: passkeyLoginPage
      summary: Render the public passkey login page.
      security: []
      responses:
        "200":
          description: Passkey login HTML.
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/passkey/login/options:
    post:
      tags: [Auth]
      operationId: passkeyLoginOptions
      summary: Create passkey authentication options.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: User subject, username or email for standalone passkey login.
                step_up:
                  type: string
                  description: One-time MFA / step-up token issued after primary authentication.
                return_to:
                  type: string
      responses:
        "200":
          description: WebAuthn authentication challenge.
          content:
            application/json:
              schema:
                type: object
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/passkey/login/verify:
    post:
      tags: [Auth]
      operationId: passkeyLoginVerify
      summary: Verify passkey authentication and issue a session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Passkey session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/step-up:
    get:
      tags: [Auth]
      operationId: stepUpPage
      summary: Render the public MFA / step-up page.
      description: The page is reachable before the app session is issued and is guarded by the one-time step-up token.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
        - in: query
          name: return_to
          schema:
            type: string
            default: /status
      responses:
        "200":
          description: MFA / step-up HTML.
          content:
            text/html:
              schema:
                type: string
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/step-up/status:
    get:
      tags: [Auth]
      operationId: getStepUpStatus
      summary: Return the pending MFA / step-up challenge metadata.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pending challenge metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUpStatus"
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/step-up/passkey/register/options:
    post:
      tags: [Auth]
      operationId: stepUpPasskeyRegisterOptions
      summary: Create passkey registration options for an MFA / step-up challenge.
      description: Allows first-passkey enrollment only for the user bound to the pending step-up token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpPasskeyRegisterRequest"
      responses:
        "200":
          description: WebAuthn registration challenge.
          content:
            application/json:
              schema:
                type: object
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/step-up/passkey/register/verify:
    post:
      tags: [Auth]
      operationId: stepUpPasskeyRegisterVerify
      summary: Verify a step-up passkey registration and issue the app session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Registered passkey plus issued session user.
          content:
            application/json:
              schema:
                type: object
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/auth/step-up/totp/setup/start:
    post:
      tags: [Auth]
      operationId: stepUpTotpSetupStart
      summary: Start TOTP enrollment for an MFA / step-up challenge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpTokenRequest"
      responses:
        "200":
          description: TOTP setup payload scoped to the step-up user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUpTotpSetup"

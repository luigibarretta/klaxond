openapi: 3.1.0
info:
  title: klaxond API
  version: 0.14.15
  summary: Notification bridge backend API
  description: |
    klaxond receives monitoring webhooks, renders notification payloads, manages
    routing/inhibition policy, and exposes a zero-build admin UI.

    Browser sessions use the `klaxond_session` cookie plus `X-Klaxond-CSRF` on
    same-origin mutations. Scoped machine clients should use Bearer tokens.
    Sensitive browser mutations can also return `428 Precondition Required`
    with `X-Klaxond-Reauth: required`; call `/auth/sudo` or complete passkey
    reauthentication before retrying.
servers:
  - url: /
tags:
  - name: Public
    description: Health, metrics, OpenAPI, UI and public informational pages.
  - name: Ingest
    description: Machine-to-machine webhook ingress.
  - name: Auth
    description: Login, local MFA, passkeys, sessions, API keys and PATs.
  - name: Operations
    description: Status, setup, logs, audit and channel diagnostics.
  - name: Config
    description: Configuration read/write, import, export and restore endpoints.
  - name: Routing
    description: Delivery, cascade, ntfy topics and ingest authentication.
  - name: Policy
    description: Inhibitions, schedules, acknowledgements, dedup and simulations.
  - name: Render
    description: Notification rendering configuration and previews.

paths:
  /openapi.yaml:
    get:
      tags: [Public]
      operationId: getOpenApiYaml
      summary: Download the OpenAPI document.
      security: []
      responses:
        "200":
          description: YAML OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /api/openapi.yaml:
    get:
      tags: [Public]
      operationId: getOpenApiYamlAlias
      summary: Download the OpenAPI document from the API namespace.
      security: []
      responses:
        "200":
          description: YAML OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /swagger:
    get:
      tags: [Public]
      operationId: swaggerUi
      summary: Render the self-hosted Swagger UI for the OpenAPI contract.
      security: []
      responses:
        "200":
          description: Swagger UI HTML.
          content:
            text/html:
              schema:
                type: string
  /api/docs:
    get:
      tags: [Public]
      operationId: swaggerUiAlias
      summary: Render the self-hosted Swagger UI from the API namespace.
      security: []
      responses:
        "200":
          description: Swagger UI HTML.
          content:
            text/html:
              schema:
                type: string
  /healthz:
    get:
      tags: [Public]
      operationId: healthz
      summary: Health check used by container probes and load balancers.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /metrics:
    get:
      tags: [Public]
      operationId: prometheusMetrics
      summary: Prometheus metrics scrape endpoint.
      security: []
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
  /webhook/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestGrafanaAlertmanager
      summary: Receive a Grafana Alertmanager webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /beszel/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestBeszel
      summary: Receive a Beszel webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /healthchecks/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestHealthchecks
      summary: Receive a Healthchecks webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /wud/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestWud
      summary: Receive a WUD HTTP trigger.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /authentik/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestAuthentik
      summary: Receive an Authentik event webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /shelfmark/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestShelfmark
      summary: Receive a Shelfmark event webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /prowlarr/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestProwlarr
      summary: Receive a Prowlarr event webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /decypharr/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestDecypharr
      summary: Receive a Decypharr event webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /pve/{severity}:
    post:
      tags: [Ingest]
      operationId: ingestPve
      summary: Receive a Proxmox VE event webhook.
      security: []
      parameters:
        - $ref: "#/components/parameters/Severity"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPayload"
      responses:
        "200":
          $ref: "#/components/responses/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/login:
    get:
      tags: [Auth]
      operationId: loginPage
      summary: Render the public login page or redirect an existing session.
      security: []
      parameters:
        - name: return_to
          in: query
          schema:
            type: string
            default: /ui/status
        - name: start
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Starts the OIDC redirect when OIDC mode is active.
      responses:
        "200":
          description: Login HTML.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to OIDC or an already authenticated return URL.
    post:
      tags: [Auth]
      operationId: localLogin
      summary: Create a local username/password session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JSON login response for fetch requests.
          headers:
            Set-Cookie:
              description: Signed `klaxond_session` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "302":
          description: HTML form login redirects to the sanitized return URL.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/callback:
    get:
      tags: [Auth]
      operationId: oidcCallback
      summary: Complete the OIDC authorization-code callback.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Session established and redirected to the original return URL.
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: OIDC discovery or token exchange failed.
  /auth/logout:
    get:
      tags: [Auth]
      operationId: logout
      summary: Clear session cookies and redirect to the login screen.
      security: []
      responses:
        "302":
          description: Redirects to `/auth/login?logged_out=1`.
  /auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      summary: Return the current user, auth mode, scopes and browser CSRF token.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sudo:
    post:
      tags: [Auth]
      operationId: sudoReauth
      summary: Refresh the short reauthentication window for local sessions.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SudoRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SudoRequest"
      responses:
        "200":
          description: Reauthentication accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SudoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/passkey:
    get:
      tags: [Auth]
      operationId: passkeyLoginPage
      summary: Render the public passkey login page.
      security: []
      responses:
        "200":
          description: Passkey login HTML.
  /auth/passkey/start:
    post:
      tags: [Auth]
      operationId: passkeyLoginStart
      summary: Start passkey authentication.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                return_to:
                  type: string
      responses:
        "200":
          description: WebAuthn authentication challenge.
          content:
            application/json:
              schema:
                type: object
  /auth/passkey/finish:
    post:
      tags: [Auth]
      operationId: passkeyLoginFinish
      summary: Complete passkey authentication and issue a session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Passkey session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/status:
    get:
      tags: [Operations]
      operationId: getStatus
      summary: Return runtime status, channel health and recent activity.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Status payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPayload"
  /api/setup-status:
    get:
      tags: [Operations]
      operationId: getSetupStatus
      summary: Return readiness/setup checks used by the UI.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Setup checks grouped by area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/channel-test-matrix:
    get:
      tags: [Operations]
      operationId: getChannelTestMatrix
      summary: Dry-run channel connectivity matrix; sends no notification.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Channel matrix.
          content:
            application/json:
              schema:
                type: object
  /api/logs:
    get:
      tags: [Operations]
      operationId: searchLogs
      summary: Search backend/frontend log entries.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Level"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated log entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLogs"
  /api/audit:
    get:
      tags: [Operations]
      operationId: searchAudit
      summary: Search security and configuration audit entries.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAudit"
  /api/client-log:
    post:
      tags: [Operations]
      operationId: recordClientLog
      summary: Record a bounded frontend log entry in the backend log buffer.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level:
                  type: string
                  enum: [info, warn, warning, error]
                key:
                  type: string
                message:
                  type: string
                path:
                  type: string
                stack:
                  type: string
                userAgent:
                  type: string
      responses:
        "204":
          description: Log entry accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Payload is larger than the accepted frontend log limit.
  /api/deliveries:
    get:
      tags: [Operations]
      operationId: listDeliveries
      summary: Return the recent delivery ring buffer.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Recent deliveries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
  /api/auth-config:
    get:
      tags: [Auth]
      operationId: getAuthConfig
      summary: Return redacted auth settings and available auth modes/scopes.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Redacted auth settings.
          content:
            application/json:
              schema:
                type: object
    post:
      tags: [Auth]
      operationId: updateAuthConfig
      summary: Replace auth settings after validation.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthConfigUpdate"
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /api/auth/tokens:
    get:
      tags: [Auth]
      operationId: listTokens
      summary: List API keys and PATs without token secrets.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Token metadata and available scopes.
          content:
            application/json:
              schema:
                type: object
    post:
      tags: [Auth]
      operationId: createToken
      summary: Create a scoped API key or PAT.
      description: The raw token is returned once; store the prefix for later identification.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "200":
          description: Created token and one-time secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /api/auth/tokens/revoke:
    post:
      tags: [Auth]
      operationId: revokeToken
      summary: Revoke an API key or PAT.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /api/auth/totp/start:
    post:
      tags: [Auth]
      operationId: startTotp
      summary: Generate a local TOTP setup secret and otpauth URI.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: TOTP setup payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /api/auth/totp/enable:
    post:
      tags: [Auth]
      operationId: enableTotp
      summary: Enable local TOTP after validating the current code.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpEnableRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /api/auth/totp/disable:
    post:
      tags: [Auth]
      operationId: disableTotp
      summary: Disable local TOTP.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /api/auth/passkeys:
    get:
      tags: [Auth]
      operationId: listPasskeys
      summary: List registered passkeys and public WebAuthn settings.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Passkey metadata.
          content:
            application/json:
              schema:
                type: object
  /api/auth/passkeys/register/start:
    post:
      tags: [Auth]
      operationId: passkeyRegisterStart
      summary: Start passkey registration for the current local user.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: WebAuthn registration challenge.
          content:
            application/json:
              schema:
                type: object
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /api/auth/passkeys/register/finish:
    post:
      tags: [Auth]
      operationId: passkeyRegisterFinish
      summary: Complete passkey registration.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /api/auth/passkeys/delete:
    post:
      tags: [Auth]
      operationId: deletePasskey
      summary: Delete a registered passkey.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "428":
          $ref: "#/components/responses/ReauthRequired"
  /api/config/backup:
    get:
      tags: [Config]
      operationId: downloadConfigBackup
      summary: Download the current TOML configuration.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: "`klaxond.toml` attachment."
          content:
            application/toml:
              schema:
                type: string
  /api/config/export:
    get:
      tags: [Config]
      operationId: exportConfigBundle
      summary: Export a complete settings bundle.
      description: Admin-only export containing TOML, sidecar JSON files, auth sidecars and runtime-derived secret placeholders.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Full settings bundle JSON attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigBundle"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/config/backups:
    get:
      tags: [Config]
      operationId: listConfigBackups
      summary: List automatic config backups created before restore.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Backup metadata.
          content:
            application/json:
              schema:
                type: object
  /api/config/import-preview:
    post:
      tags: [Config]
      operationId: previewConfigImport
      summary: Validate and diff a TOML or full settings bundle before restore.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigBundle"
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Import validation and diff result.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/config/restore:
    post:
      tags: [Config]
      operationId: restoreConfig
      summary: Restore a TOML or full settings bundle after an automatic backup.
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigBundle"
          text/plain:
            schema:
              type: string
      responses:
        "200":

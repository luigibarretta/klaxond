        "200":
          description: Rule test result.
          content:
            application/json:
              schema:
                type: object
        "4XX":
          $ref: "#/components/responses/ClientError"
  /api/inhibitions/clear:
    post:
      tags: [Policy]
      operationId: clearInhibitions
      summary: Clear active runtime inhibitions.
      security:
        - bearerAuth: []

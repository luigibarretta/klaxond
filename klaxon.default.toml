# klaxon.toml — bootstrap config for Klaxon notification bridge.
# Loaded at container start from /data/klaxon.toml (or KLAXON_CONFIG path).
# If the file is missing, the defaults below are written on first run.
# Env vars (NTFY_TOKEN_*, TELEGRAM_BOT_TOKEN, SMTP_*) override the runtime
# secrets — they are NOT stored in this file.

# ============================================================================
# Cascade — what fallback chain to use when ntfy fails
# ============================================================================
[cascade]
# Apply cascade to /webhook/* (Grafana via Alertmanager) by default.
# /beszel/* always uses cascade regardless of this setting.
default_enabled_for_webhook = false

# Tiers tried IN ORDER. Stops at first success. Channels not in this list
# are skipped entirely. Re-order or drop tiers as you like.
[[cascade.tiers]]
name = "ntfy"
timeout_seconds = 5

[[cascade.tiers]]
name = "telegram"
timeout_seconds = 8

[[cascade.tiers]]
name = "smtp"
timeout_seconds = 10


# ============================================================================
# Render — how alerts are formatted for the ntfy push
# ============================================================================
[render]
grafana_base = "https://grafana.luigibarretta.com"

# Emoji used in the title per severity.
[render.severity_emoji]
info     = "ℹ️"
warning  = "⚠️"
critical = "🚨"
resolved = "✅"

# ntfy priority per severity.
[render.severity_priority]
info     = "default"
warning  = "high"
critical = "urgent"
resolved = "low"

# Tag (ntfy emoji-name) prefix added before per-alert tags.
[render.severity_tag_prefix]
info     = "information_source"
warning  = "warning"
critical = "rotating_light"
resolved = "white_check_mark"

# component label → [button_label, url_or_path].
# Paths starting with / are appended to grafana_base.
[render.component_dashboards]
ups        = ["UPS dashboard",        "/d/ups-ecoflow-overview"]
postgres   = ["Postgres cluster",     "/d/infra-postgres-cluster"]
loki       = ["Logs (Loki)",          "/d/loki-cluster-logs"]
traefik    = ["Traefik",              "/d/qPdAviJmz4"]
authentik  = ["Authentik",            "/d/authentik"]
prometheus = ["Prometheus targets",   "/explore"]
docker     = ["Logs (Loki)",          "/d/loki-cluster-logs"]
host       = ["Logs (Loki)",          "/d/loki-cluster-logs"]
backup     = ["Backup health",        "/d/infra-backup-health"]
semaphore  = ["Semaphore tasks",      "/d/infra-semaphore-tasks"]
fail2ban   = ["Fail2ban",             "/d/fail2ban-cluster"]
dns        = ["DNS resolvers",        "/d/infra-dns-resolvers"]
clamav     = ["ClamAV logs",          "/d/loki-cluster-logs?var-container=clamd"]
zfs        = ["ZFS / nas-01 logs",    "/d/loki-cluster-logs?var-host=it1-prd-nas-01"]
beszel     = ["Beszel UI",            "https://beszel.luigibarretta.com/"]


# ============================================================================
# Inhibitions — in-memory safety net (Alertmanager owns the canonical layer).
# Evaluated in order; first matching source wins.
# ============================================================================
[[inhibitions]]
# source: identified by the `inhibition_source` label on the firing alert.
source = "node-down"
# Suppress every alert whose `host` label equals the source's `host` value.
match_by = "host"
ttl_seconds = 900

[[inhibitions]]
source = "traefik-down"
# Suppress alerts whose label `job` matches the regex.
match_label = "job"
match_regex = "^blackbox-(https|http).*"
ttl_seconds = 900

[[inhibitions]]
source = "authentik-down"
match_label = "job"
match_regex = "^blackbox-https.*"
ttl_seconds = 900

[[inhibitions]]
source = "cluster-wide-restart"
# Suppress EVERYTHING (except the source itself).
match_all = true
ttl_seconds = 1800

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Homelab tutto amd64: niente QEMU/arm64 (2026-06-10). Il driver docker di
# default usa la cache del daemon del runner (dev-01) -> nessun pull della
# base image da docker.io se gia presente (evita il rate-limit 429).
jobs:
  build:
    runs-on: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout auth-modules
        uses: actions/checkout@v4
        with:
          repository: luigibarretta/auth-modules
          path: auth-modules

      - name: Install check tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep

      - name: Check RSA private-key usage
        run: bash scripts/check-rsa-private-usage.sh

      - name: Check auth gold standard
        run: bash scripts/check-auth-gold-standard.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint OpenAPI
        run: npm run openapi:lint

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.luigibarretta.com
          username: luigibarretta
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            git.luigibarretta.com/${{ github.repository_owner }}/klaxond
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64, docker driver = cache locale)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            auth-modules=auth-modules
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image summary
        run: |
          echo "Built tags:"
          echo "${{ steps.meta.outputs.tags }}"

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: docker
    timeout-minutes: 60
    env:
      SEMAPHORE_TEMPLATE_ID: "101"
      SEMAPHORE_TIMEOUT_SECONDS: "3000"
    steps:
      - name: Trigger and wait for Semaphore deploy
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag="main"
          fi
          export SEMAPHORE_ENVIRONMENT="{\"klaxond_image_tag\":\"${tag}\"}"
          payload="$(mktemp)"
          task="$(mktemp)"
          python3 - <<'PY' > "$payload"
          import json, os
          env = os.environ["SEMAPHORE_ENVIRONMENT"]
          json.loads(env)
          print(json.dumps({
              "template_id": int(os.environ["SEMAPHORE_TEMPLATE_ID"]),
              "environment": env,
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.SEMAPHORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @"$payload" \
            http://192.168.50.150:4000/api/project/1/tasks > "$task"
          task_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$task")"
          deadline=$(( $(date +%s) + ${SEMAPHORE_TIMEOUT_SECONDS} ))
          while :; do
            curl -fsS \
              -H "Authorization: Bearer ${{ secrets.SEMAPHORE_TOKEN }}" \
              "http://192.168.50.150:4000/api/project/1/tasks/${task_id}" > "$task"
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$task")"
            echo "Semaphore task ${task_id}: ${status}"
            case "$status" in
              success) exit 0 ;;
              error|failed|stopped) cat "$task"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for Semaphore task ${task_id}"
              exit 1
            fi
            sleep 10
          done

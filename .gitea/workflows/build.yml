name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        # Only on push to main/tag (not PRs from forks).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: git.luigibarretta.com
          username: luigibarretta
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image name = git.luigibarretta.com/<owner-lowercased>/<repo>
          images: |
            git.luigibarretta.com/${{ github.repository_owner }}/klaxond
          tags: |
            # Tag pushes → exact tag (e.g. v0.2.0) and major+minor (v0.2)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Branch push (main) → latest + branch name
            type=ref,event=branch
            # PR builds → pr-<num> (only locally, never pushed)
            type=ref,event=pr
            # main → latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push only on push events (not PRs).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image summary
        run: |
          echo "Built tags:"
          echo "${{ steps.meta.outputs.tags }}"

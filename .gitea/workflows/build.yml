name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Homelab tutto amd64: niente QEMU/arm64 (2026-06-10). Il driver docker di
# default usa la cache del daemon del runner (dev-01) -> nessun pull della
# base image da docker.io se gia presente (evita il rate-limit 429).
jobs:
  build:
    runs-on: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check RSA private-key usage
        run: bash scripts/check-rsa-private-usage.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint OpenAPI
        run: npm run openapi:lint

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.luigibarretta.com
          username: luigibarretta
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            git.luigibarretta.com/${{ github.repository_owner }}/klaxond
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64, docker driver = cache locale)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Release automatica (2026-06-12): sui TAG vX.Y.Z la CI lancia il deploy
      # via Semaphore (template 101 = deploy-klaxond.yml di infra-ansible)
      # passando il tag come extra-vars -> sovrascrive klaxond_image_tag in
      # ENTRAMBI i play + compose (immagine templata). Niente piu' bump
      # manuale per deployare; i default nel playbook restano per i run manuali.
      - name: Auto-deploy release via Semaphore (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.SEMAPHORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"template_id\": 101, \"environment\": \"{\\\"klaxond_image_tag\\\": \\\"${VERSION}\\\"}\"}" \
            http://192.168.50.150:4000/api/project/1/tasks

      - name: Image summary
        run: |
          echo "Built tags:"
          echo "${{ steps.meta.outputs.tags }}"

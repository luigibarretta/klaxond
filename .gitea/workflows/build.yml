name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: klaxond-${{ github.ref }}
  cancel-in-progress: true

# Homelab tutto amd64: niente QEMU/arm64 (2026-06-10). Il driver docker di
# default usa la cache del daemon del runner (dev-01) -> nessun pull della
# base image da docker.io se gia presente (evita il rate-limit 429).
jobs:
  check:
    runs-on: docker
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: klaxond_test
          POSTGRES_USER: klaxond
          POSTGRES_PASSWORD: klaxond-test
        options: >-
          --health-cmd "pg_isready -U klaxond -d klaxond_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned repository tooling
        uses: actions/checkout@v4
        with:
          repository: luigibarretta/repo-tooling
          ref: 7686291766ce5d185fefd4f60b1cb15b9a34c3da
          path: vendor/repo-tooling

      - name: Verify pinned repository tooling
        run: scripts/check-repo-tooling-sync.sh

      - name: Install check tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep

      - name: Check RSA private-key usage
        run: bash scripts/check-rsa-private-usage.sh

      - name: Check auth gold standard
        run: bash scripts/check-auth-gold-standard.sh

      - name: Restore Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust application
        run: cargo check --locked --all-features

      - name: Lint Rust application
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust application
        run: cargo test --locked --all-features -- --nocapture

      - name: Test PostgreSQL persistence
        env:
          KLAXOND_TEST_POSTGRES_URL: postgres://klaxond:klaxond-test@postgres:5432/klaxond_test
        run: cargo test --locked --all-features -- --ignored --nocapture --test-threads=1

      - name: Test Rust application-event SDK
        run: cargo test --manifest-path sdk/rust/Cargo.toml --locked

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test Go application-event SDK
        run: cd sdk/go && go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Check frontend JavaScript syntax
        run: npm run static:check

      - name: Check LOC guardrails
        run: npm run loc:check

      - name: NASA/JPL maintainability warnings
        env:
          NASA_WARNINGS_FAIL: "0"
        run: npm run nasa:warn

      - name: Lint OpenAPI
        run: npm run openapi:lint

      - name: Check release version contract
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm run release:check -- --tag "$GITHUB_REF_NAME"
          else
            npm run release:check
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browser workflows
        run: npm run test:e2e

  publish-main:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: docker
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.luigibarretta.com
          username: luigibarretta
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            git.luigibarretta.com/${{ github.repository_owner }}/klaxond
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=klaxond
            org.opencontainers.image.description=Notification routing service with noise control, delivery history, and admin UI
            org.opencontainers.image.url=https://github.com/luigibarretta/klaxond
            org.opencontainers.image.source=https://github.com/luigibarretta/klaxond
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push (amd64, docker driver = cache locale)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify immutable image metadata
        env:
          IMAGE: git.luigibarretta.com/${{ github.repository_owner }}/klaxond:${{ github.sha }}
          EXPECTED_SOURCE: https://github.com/luigibarretta/klaxond
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          title="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')"
          description="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.description" }}')"
          licenses="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
          source="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          test "$title" = "klaxond"
          test -n "$description"
          test "$licenses" = "Apache-2.0"
          test "$source" = "$EXPECTED_SOURCE"

      - name: Image summary
        run: |
          echo "Built tags:"
          echo "${{ steps.meta.outputs.tags }}"

  promote-release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: deploy
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.luigibarretta.com
          username: luigibarretta
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Compute release image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            git.luigibarretta.com/${{ github.repository_owner }}/klaxond
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Promote the tested immutable image
        env:
          SOURCE_IMAGE: git.luigibarretta.com/${{ github.repository_owner }}/klaxond:${{ github.sha }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker pull "$SOURCE_IMAGE"
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            docker tag "$SOURCE_IMAGE" "$target"
            docker push "$target"
          done <<< "$RELEASE_TAGS"

  deploy:
    needs: promote-release
    # Mutable branch tags are useful for testing images, but production must
    # only ever be recreated from an immutable release tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: deploy
    timeout-minutes: 60
    env:
      SEMAPHORE_TEMPLATE_ID: "101"
      SEMAPHORE_TIMEOUT_SECONDS: "3000"
    steps:
      - name: Trigger and wait for Semaphore deploy
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          export SEMAPHORE_ENVIRONMENT="{\"klaxond_image_tag\":\"${tag}\"}"
          payload="$(mktemp)"
          task="$(mktemp)"
          python3 - <<'PY' > "$payload"
          import json, os
          env = os.environ["SEMAPHORE_ENVIRONMENT"]
          json.loads(env)
          print(json.dumps({
              "template_id": int(os.environ["SEMAPHORE_TEMPLATE_ID"]),
              "environment": env,
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.SEMAPHORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @"$payload" \
            http://192.168.50.150:4000/api/project/1/tasks > "$task"
          task_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$task")"
          deadline=$(( $(date +%s) + ${SEMAPHORE_TIMEOUT_SECONDS} ))
          while :; do
            curl -fsS \
              -H "Authorization: Bearer ${{ secrets.SEMAPHORE_TOKEN }}" \
              "http://192.168.50.150:4000/api/project/1/tasks/${task_id}" > "$task"
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$task")"
            echo "Semaphore task ${task_id}: ${status}"
            case "$status" in
              success) exit 0 ;;
              error|failed|stopped) cat "$task"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for Semaphore task ${task_id}"
              exit 1
            fi
            sleep 10
          done

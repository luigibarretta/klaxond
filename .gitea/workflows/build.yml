name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: klaxond-${{ github.ref }}
  cancel-in-progress: true

# Homelab tutto amd64: niente QEMU/arm64 (2026-06-10). Il driver docker di
# default usa la cache del daemon del runner (dev-01) -> nessun pull della
# base image da docker.io se gia presente (evita il rate-limit 429).
jobs:
  check:
    runs-on: docker
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: klaxond_test
          POSTGRES_USER: klaxond
          POSTGRES_PASSWORD: klaxond-test
        options: >-
          --health-cmd "pg_isready -U klaxond -d klaxond_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # Checks come from ci-local.json through the vendored ci-local runner,
      # the same entry point used before a push
      # (`node third_party/repo-tooling/ci-local.mjs --quick`, then the full
      # gate). Every manifest step runs in exactly one call below
      # (scripts/check-ci-local-jobs.mjs). Plain workflow steps are CI-only:
      # checkouts, the repo-tooling pin check, toolchains, caches, system
      # packages, image build/publish, promotion and deploy.
      - name: Checkout
        uses: actions/checkout@v4

      # CI-only: verifies third_party/repo-tooling against a checkout of the
      # commit pinned in dependencies/repo-tooling.sha.
      - name: Checkout pinned repository tooling
        uses: actions/checkout@v4
        with:
          repository: luigibarretta/repo-tooling
          ref: da53160c52a8cb3f83201e57b333ec399b87bcde
          path: vendor/repo-tooling

      - name: Verify pinned repository tooling
        run: scripts/check-repo-tooling-sync.sh

      # CI-only provisioning: the guards use ripgrep.
      - name: Install check tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep

      - name: Restore Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      - name: Restore pinned cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}

      - name: Install pinned cargo-audit when absent from cache
        run: |
          if ! cargo-audit --version 2>/dev/null | grep -q 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: package-lock.json

      # RUSTSEC-2023-0071 and RUSTSEC-2026-0387 are ignored in the
      # audit-lockfiles step of ci-local.json, each with its reason; see
      # docs/security/rustsec-policy.md. Every other advisory fails CI.
      - name: Repository guards, release contract, LOC, NASA, static checks and dependency audit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export RELEASE_CONTRACT_TAG="$GITHUB_REF_NAME"
          fi
          node third_party/repo-tooling/ci-local.mjs --ci --only ci-local-jobs,rsa-guard,auth-gold,release-pipeline,release-contract,loc,nasa,static-check,audit-lockfiles,rust-fmt,sdk-go

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Rust check, lint, tests, PostgreSQL persistence and SDK tests
        env:
          KLAXOND_TEST_POSTGRES_URL: postgres://klaxond:klaxond-test@postgres:5432/klaxond_test
        run: node third_party/repo-tooling/ci-local.mjs --ci --only rust-check,rust-clippy,rust-test,rust-test-postgres,sdk-rust

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies and lint OpenAPI
        run: node third_party/repo-tooling/ci-local.mjs --ci --only npm-install,openapi-lint

      # CI-only provisioning: the browsers and their system packages.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browser workflows
        run: node third_party/repo-tooling/ci-local.mjs --ci --no-needs --only e2e

  # CI-only from here on: image build and publication, release promotion and
  # the Semaphore deploy. None of these run in the local gate.
  publish-immutable:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: docker
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.luigibarretta.com
          username: luigibarretta
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Read canonical package version
        id: package
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            git.luigibarretta.com/${{ github.repository_owner }}/klaxond
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=klaxond
            org.opencontainers.image.description=Notification routing service with noise control, delivery history, and admin UI
            org.opencontainers.image.url=https://git.luigibarretta.com/${{ github.repository }}
            org.opencontainers.image.source=https://git.luigibarretta.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push (amd64, docker driver = cache locale)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify immutable image metadata
        env:
          IMAGE: git.luigibarretta.com/${{ github.repository_owner }}/klaxond:${{ github.sha }}
          EXPECTED_SOURCE: https://git.luigibarretta.com/${{ github.repository }}
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          title="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')"
          description="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.description" }}')"
          licenses="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
          source="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          version="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          revision="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$title" = "klaxond"
          test -n "$description"
          test "$licenses" = "Apache-2.0"
          test "$source" = "$EXPECTED_SOURCE"
          test "$version" = "$EXPECTED_VERSION"
          test "$revision" = "$EXPECTED_REVISION"

      - name: Image summary
        run: |
          echo "Built tags:"
          echo "${{ steps.meta.outputs.tags }}"

  promote-release:
    # The tag workflow must build/publish its own exact SHA after checks. A
    # separate main-branch run can be queued behind other work and therefore
    # is not a valid release dependency.
    needs: [check, publish-immutable]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: deploy
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.luigibarretta.com
          username: luigibarretta
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Compute release image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            git.luigibarretta.com/${{ github.repository_owner }}/klaxond
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Promote the tested immutable image
        env:
          SOURCE_IMAGE: git.luigibarretta.com/${{ github.repository_owner }}/klaxond:${{ github.sha }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker pull "$SOURCE_IMAGE"
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            docker tag "$SOURCE_IMAGE" "$target"
            docker push "$target"
          done <<< "$RELEASE_TAGS"

  deploy:
    needs: promote-release
    # Mutable branch tags are useful for testing images, but production must
    # only ever be recreated from an immutable release tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: deploy
    timeout-minutes: 60
    env:
      SEMAPHORE_TEMPLATE_ID: "101"
      SEMAPHORE_TIMEOUT_SECONDS: "3000"
    steps:
      - name: Trigger and wait for Semaphore deploy
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          export SEMAPHORE_ENVIRONMENT="{\"klaxond_image_tag\":\"${tag}\"}"
          payload="$(mktemp)"
          task="$(mktemp)"
          python3 - <<'PY' > "$payload"
          import json, os
          env = os.environ["SEMAPHORE_ENVIRONMENT"]
          json.loads(env)
          print(json.dumps({
              "template_id": int(os.environ["SEMAPHORE_TEMPLATE_ID"]),
              "environment": env,
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.SEMAPHORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @"$payload" \
            http://192.168.50.150:4000/api/project/1/tasks > "$task"
          task_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$task")"
          deadline=$(( $(date +%s) + ${SEMAPHORE_TIMEOUT_SECONDS} ))
          while :; do
            curl -fsS \
              -H "Authorization: Bearer ${{ secrets.SEMAPHORE_TOKEN }}" \
              "http://192.168.50.150:4000/api/project/1/tasks/${task_id}" > "$task"
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$task")"
            echo "Semaphore task ${task_id}: ${status}"
            case "$status" in
              success) exit 0 ;;
              error|failed|stopped) cat "$task"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for Semaphore task ${task_id}"
              exit 1
            fi
            sleep 10
          done
